<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello, World</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #f4f9f1;
      font-family: system-ui, sans-serif;
      color: #2d5a27;
    }
    svg { width: min(320px, 80vw); height: auto; }
  </style>
</head>
<body>
  <h1>Hello, World!</h1>
  <svg viewBox="0 0 200 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A pink flower">
    <!-- stem -->
    <path d="M100 150 C95 200 105 250 100 295" stroke="#3f8f3a" stroke-width="6" fill="none" stroke-linecap="round"/>
    <!-- leaves -->
    <path d="M100 235 C65 215 45 225 40 245 C65 255 90 250 100 235Z" fill="#4caf50"/>
    <path d="M101 205 C135 185 158 195 162 215 C138 225 112 220 101 205Z" fill="#43a047"/>
    <!-- petals -->
    <g transform="translate(100 90)" fill="#f48fb1" stroke="#ec6a98" stroke-width="1.5">
      <ellipse cx="0" cy="-42" rx="19" ry="34"/>
      <ellipse cx="0" cy="-42" rx="19" ry="34" transform="rotate(45)"/>
      <ellipse cx="0" cy="-42" rx="19" ry="34" transform="rotate(90)"/>
      <ellipse cx="0" cy="-42" rx="19" ry="34" transform="rotate(135)"/>
      <ellipse cx="0" cy="-42" rx="19" ry="34" transform="rotate(180)"/>
      <ellipse cx="0" cy="-42" rx="19" ry="34" transform="rotate(225)"/>
      <ellipse cx="0" cy="-42" rx="19" ry="34" transform="rotate(270)"/>
      <ellipse cx="0" cy="-42" rx="19" ry="34" transform="rotate(315)"/>
    </g>
    <!-- center -->
    <circle cx="100" cy="90" r="20" fill="#ffca28"/>
    <circle cx="100" cy="90" r="20" fill="none" stroke="#f9a825" stroke-width="2"/>
  </svg>
</body>
</html>
