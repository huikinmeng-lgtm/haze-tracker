<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello, World</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #eaf6ff;
      font-family: system-ui, sans-serif;
      color: #3b5a2a;
    }
    svg { width: min(560px, 94vw); height: auto; }

    .hop {
      animation: hop 1.1s ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: center bottom;
    }
    .d1 { animation-delay: -0.2s; }
    .d2 { animation-delay: -0.5s; }
    .d3 { animation-delay: -0.8s; }
    .d4 { animation-delay: -0.35s; }
    .d5 { animation-delay: -0.65s; }

    @keyframes hop {
      0%, 100% { transform: translateY(0) rotate(-4deg); }
      50%      { transform: translateY(-38px) rotate(4deg); }
    }
    .wobble {
      animation: wobble 2.2s ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: center;
    }
    @keyframes wobble {
      0%, 100% { transform: rotate(-3deg); }
      50%      { transform: rotate(3deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .hop, .wobble { animation: none; }
    }
  </style>
</head>
<body>
  <h1>Hello, World!</h1>
  <svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Five monkeys jumping around a banana">
    <defs>
      <!-- one monkey, centered on its hips, arms up -->
      <g id="monkey">
        <path d="M14 18 C42 14 46 -10 30 -18" stroke="#6f4520" stroke-width="5" fill="none" stroke-linecap="round"/>
        <path d="M-8 28 L-14 44 M8 28 L14 44" stroke="#8d5a2b" stroke-width="8" stroke-linecap="round"/>
        <ellipse cx="0" cy="12" rx="16" ry="20" fill="#8d5a2b"/>
        <ellipse cx="0" cy="16" rx="9" ry="13" fill="#ecd0a8"/>
        <path d="M-13 2 L-30 -16 M13 2 L30 -16" stroke="#8d5a2b" stroke-width="7" stroke-linecap="round"/>
        <circle cx="-15" cy="-18" r="6.5" fill="#8d5a2b"/>
        <circle cx="15" cy="-18" r="6.5" fill="#8d5a2b"/>
        <circle cx="-15" cy="-18" r="3.2" fill="#ecd0a8"/>
        <circle cx="15" cy="-18" r="3.2" fill="#ecd0a8"/>
        <circle cx="0" cy="-16" r="14" fill="#8d5a2b"/>
        <ellipse cx="0" cy="-13" rx="10" ry="9" fill="#ecd0a8"/>
        <circle cx="-4" cy="-16" r="1.9" fill="#222"/>
        <circle cx="4" cy="-16" r="1.9" fill="#222"/>
        <path d="M-4.5 -9 Q0 -4 4.5 -9" stroke="#5a2e12" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      </g>
    </defs>

    <!-- sky and ground -->
    <rect width="400" height="300" fill="#eaf6ff"/>
    <circle cx="350" cy="45" r="22" fill="#ffe27a"/>
    <path d="M0 262 Q100 245 200 258 T400 255 V300 H0 Z" fill="#8fd16a"/>

    <!-- shadows -->
    <g fill="#000" opacity="0.12">
      <ellipse cx="200" cy="252" rx="55" ry="7"/>
      <ellipse cx="60" cy="262" rx="20" ry="4"/>
      <ellipse cx="130" cy="268" rx="20" ry="4"/>
      <ellipse cx="270" cy="268" rx="20" ry="4"/>
      <ellipse cx="340" cy="262" rx="20" ry="4"/>
    </g>

    <!-- banana -->
    <g transform="translate(200 205) rotate(-8)">
      <g class="wobble">
        <path d="M-45 -25 Q0 62 52 -12 Q6 22 -45 -25 Z" fill="#ffd93b" stroke="#c99a00" stroke-width="2.5" stroke-linejoin="round"/>
        <path d="M-36 -14 Q0 36 38 -6" stroke="#fff2a0" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.8"/>
        <path d="M-45 -25 L-51 -38" stroke="#6b4a1a" stroke-width="6" stroke-linecap="round"/>
        <circle cx="52" cy="-12" r="3.5" fill="#5a3b12"/>
      </g>
    </g>

    <!-- monkeys jumping around it -->
    <g transform="translate(60 205)"><g class="hop d1"><use href="#monkey"/></g></g>
    <g transform="translate(130 222)"><g class="hop d2"><use href="#monkey"/></g></g>
    <g transform="translate(200 118)"><g class="hop d3"><use href="#monkey"/></g></g>
    <g transform="translate(270 222) scale(-1 1)"><g class="hop d4"><use href="#monkey"/></g></g>
    <g transform="translate(340 205) scale(-1 1)"><g class="hop d5"><use href="#monkey"/></g></g>
  </svg>
</body>
</html>
